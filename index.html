<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>외계인들 (ALIENS) - Portfolio</title>
    <!-- 우주 감성 필기체 및 SF 폰트 로드 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Orbitron:wght@700&family=Noto+Sans+KR:wght@300;500;900&display=swap" rel="stylesheet">
    
    <style>
        /* 우주적인 감성의 다크 모드 네온 스타일 CSS */
        :root {
            --bg-color: #0a051b;
            --card-bg: rgba(20, 15, 45, 0.7);
            --neon-purple: #bd00ff;
            --neon-cyan: #00f0ff;
            --text-color: #e0def4;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Noto Sans KR', sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            /* 별빛이 쏟아지는 듯한 배경 효과 */
            background-image: 
                radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 40px),
                radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 30px);
            background-size: 550px 550px, 350px 350px;
            background-position: 0 0, 40px 60px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 4rem;
            border-bottom: 1px solid rgba(0, 240, 255, 0.2);
            box-shadow: 0 0 20px rgba(189, 0, 255, 0.1);
        }

        /* 외계인들 메인 로고 영역 (필기체 스타일 적용) */
        .logo-container {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .logo-main {
            font-family: 'Alex Brush', cursive; /* 필기체 서체 */
            font-size: 3.5rem;
            color: #fff;
            text-shadow: 0 0 10px var(--neon-cyan), 0 0 20px var(--neon-purple);
            line-height: 0.8;
            margin: 0;
        }

        .logo-sub {
            font-family: 'Noto Sans KR', sans-serif;
            font-weight: 900;
            font-size: 0.9rem;
            letter-spacing: 6px;
            color: var(--neon-cyan);
            margin-top: 5px;
            padding-left: 5px;
            text-shadow: 0 0 5px rgba(0, 240, 255, 0.5);
        }

        .admin-zone {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        input, button, select {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--neon-cyan);
            color: #fff;
            padding: 10px 15px;
            border-radius: 5px;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus {
            box-shadow: 0 0 10px var(--neon-cyan);
        }

        button {
            cursor: pointer;
            background: linear-gradient(45deg, var(--neon-purple), var(--neon-cyan));
            border: none;
            font-weight: bold;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px var(--neon-cyan);
        }

        main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 3rem 2rem;
        }

        /* 편집자 전용 영상 업로드 폼 */
        #upload-form {
            display: none;
            background: var(--card-bg);
            border: 1px dashed var(--neon-purple);
            padding: 2rem;
            border-radius: 15px;
            margin-bottom: 3rem;
            box-shadow: 0 0 20px rgba(189, 0, 255, 0.2);
        }

        .form-group {
            margin-bottom: 1.2rem;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        /* 포트폴리오 영상 그리드 */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 2.5rem;
        }

        .video-card {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: transform 0.3s, box-shadow 0.3s;
            position: relative;
        }

        .video-card:hover {
            transform: translateY(-5px);
            border-color: var(--neon-cyan);
            box-shadow: 0 10px 25px rgba(0, 240, 255, 0.3);
        }

        .video-container {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 비율 유지 */
            height: 0;
            background: #000;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .video-info {
            padding: 1.5rem;
        }

        .video-title {
            font-size: 1.2rem;
            margin: 0 0 0.5rem 0;
            color: #fff;
        }

        .video-desc {
            font-size: 0.9rem;
            color: #a0a0c0;
            margin: 0;
        }

        .delete-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #ff4a4a;
            border: none;
            padding: 5px 10px;
            font-size: 0.8rem;
            border-radius: 3px;
            color: #fff;
            display: none;
            z-index: 10;
        }
    </style>
</head>
<body>

    <header>
        <!-- 로고 스타일 변경 영역 -->
        <div class="logo-container">
            <div class="logo-main">Aliens</div>
            <div class="logo-sub">외계인들</div>
        </div>
        <div class="admin-zone">
            <input type="password" id="password-input" placeholder="편집자 암호 입력">
            <button onclick="checkPassword()" id="auth-btn">접속</button>
        </div>
    </header>

    <main>
        <!-- 편집자 전용 업로드 섹션 -->
        <section id="upload-form">
            <h2 style="color: var(--neon-cyan); margin-top: 0;">🛸 새 주파수(영상) 등록</h2>
            <div class="form-group">
                <label>영상 제목</label>
                <input type="text" id="video-title" placeholder="프로젝트명을 입력하세요">
            </div>
            <div class="form-group">
                <label>영상 설명</label>
                <input type="text" id="video-desc" placeholder="간단한 설명을 입력하세요">
            </div>
            <div class="form-group">
                <label>링크 플랫폼 선택</label>
                <select id="link-type">
                    <option value="youtube">YouTube (공유 링크 또는 URL)</option>
                    <option value="gdrive">Google Drive (공유 링크)</option>
                </select>
            </div>
            <div class="form-group">
                <label>영상 링크 주소</label>
                <input type="text" id="video-url" placeholder="https://...">
            </div>
            <button onclick="addVideo()">우주로 발사 (업로드)</button>
        </section>

        <!-- 영상 목록 섹션 -->
        <section class="video-grid" id="video-grid">
            <!-- JavaScript에 의해 영상 카드가 동적으로 삽입됩니다 -->
        </section>
    </main>

    <script>
        // 변경된 비밀번호 설정
        const ADMIN_PASSWORD = "1111"; 
        let isEditor = false;

        // 샘플 데이터
        let videoList = [
            {
                id: 1,
                title: "외계인들 시네마틱 트레일러",
                desc: "유튜브 연동 예시 영상입니다.",
                embedUrl: "https://www.youtube.com/embed/dQw4w9WgXcQ"
            }
        ];

        document.addEventListener("DOMContentLoaded", () => {
            renderVideos();
        });

        function checkPassword() {
            const input = document.getElementById("password-input");
            const authBtn = document.getElementById("auth-btn");
            const uploadForm = document.getElementById("upload-form");

            if (!isEditor) {
                if (input.value === ADMIN_PASSWORD) {
                    isEditor = true;
                    alert("👽 편집자 권한이 승인되었습니다.");
                    input.style.display = "none";
                    authBtn.textContent = "로그아웃";
                    uploadForm.style.display = "block";
                    toggleDeleteButtons(true);
                } else {
                    alert("교신 실패: 비밀번호가 일치하지 않습니다.");
                }
            } else {
                isEditor = false;
                input.value = "";
                input.style.display = "block";
                authBtn.textContent = "접속";
                uploadForm.style.display = "none";
                toggleDeleteButtons(false);
            }
        }

        function convertToEmbedUrl(url, type) {
            try {
                if (type === 'youtube') {
                    let videoId = '';
                    if (url.includes('youtu.be/')) {
                        videoId = url.split('youtu.be/')[1].split('?')[0];
                    } else if (url.includes('v=')) {
                        videoId = url.split('v=')[1].split('&')[0];
                    } else if (url.includes('embed/')) {
                        return url;
                    }
                    return videoId ? `https://www.youtube.com/embed/${videoId}` : url;
                } 
                else if (type === 'gdrive') {
                    if (url.includes('/file/d/')) {
                        let fileId = url.split('/file/d/')[1].split('/')[0];
                        return `https://drive.google.com/file/d/${fileId}/preview`;
                    }
                    return url;
                }
            } catch (e) {
                return url;
            }
            return url;
        }

        function addVideo() {
            const title = document.getElementById("video-title").value;
            const desc = document.getElementById("video-desc").value;
            const type = document.getElementById("link-type").value;
            const url = document.getElementById("video-url").value;

            if (!title || !url) {
                alert("제목과 링크는 필수 입력 사항입니다.");
                return;
            }

            const embedUrl = convertToEmbedUrl(url, type);

            const newVideo = {
                id: Date.now(),
                title: title,
                desc: desc,
                embedUrl: embedUrl
            };

            videoList.push(newVideo);
            renderVideos();

            document.getElementById("video-title").value = "";
            document.getElementById("video-desc").value = "";
            document.getElementById("video-url").value = "";
        }

        function deleteVideo(id) {
            if(confirm("이 영상을 블랙홀로 보내시겠습니까? (삭제)")) {
                videoList = videoList.filter(video => video.id !== id);
                renderVideos();
            }
        }

        function toggleDeleteButtons(show) {
            const deleteButtons = document.querySelectorAll(".delete-btn");
            deleteButtons.forEach(btn => {
                btn.style.display = show ? "block" : "none";
            });
        }

        function renderVideos() {
            const grid = document.getElementById("video-grid");
            grid.innerHTML = "";

            videoList.forEach(video => {
                const card = document.createElement("div");
                card.className = "video-card";
                card.innerHTML = `
                    <button class="delete-btn" onclick="deleteVideo(${video.id})">삭제</button>
                    <div class="video-container">
                        <iframe src="${video.embedUrl}" allowfullscreen></iframe>
                    </div>
                    <div class="video-info">
                        <h3 class="video-title">${video.title}</h3>
                        <p class="video-desc">${video.desc}</p>
                    </div>
                `;
                grid.appendChild(card);
            });

            if (isEditor) toggleDeleteButtons(true);
        }
    </script>
</body>
</html>
